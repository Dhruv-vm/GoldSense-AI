server {
    listen 80;
    server_name api.your-vmd-bullion-domain.example;

    # Redirect HTTP -> HTTPS after Certbot/Let's Encrypt setup
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSE Live Streaming endpoint: disable proxy buffering cleanly
    location /api/bullion/stream {
        proxy_pass http://127.0.0.1:8000/api/bullion/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}

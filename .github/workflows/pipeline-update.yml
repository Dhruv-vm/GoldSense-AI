name: Daily Pipeline Update & Evaluation

on:
  # F-20: legacy update_pipeline.py is MANUAL-ONLY. It previously ran automatically after
  # every News Data Collector run and on a daily cron, in parallel with the research
  # pipeline. Re-enable a trigger only after it is reconciled with EXPERIMENT_PROTOCOL_V1.
  workflow_dispatch:

concurrency:
  group: pipeline-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required historical datasets exist
        run: |
          echo "[PIPELINE WORKFLOW] Verifying required historical datasets exist..."
          test -s data/kjpl/kjpl_rates.csv || (echo "ERROR: Missing or empty data/kjpl/kjpl_rates.csv" && exit 1)
          test -s data/news/news_articles.csv || (echo "ERROR: Missing or empty data/news/news_articles.csv" && exit 1)
          echo "[PIPELINE WORKFLOW] Required datasets verified ready (note: Yahoo Finance collector decommissioned)."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ML verification dependencies (no yfinance)
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 30
          pip install --retries 5 --timeout 30 -r backend/requirements-ml.txt
          pip install --retries 5 --timeout 30 --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 5 --timeout 30 transformers

      - name: Run offline ML pipeline update verification
        run: |
          PYTHONPATH=backend python backend/ml/training/update_pipeline.py

      - name: Validate pipeline outputs
        run: |
          PYTHONPATH=backend python scripts/validate_pipeline_outputs.py

      - name: Upload verified ML evaluation artifacts (read-only CI; no commits to develop)
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-verification
          retention-days: 7
          path: |
            backend/ml/data/processed/kjpl_events.csv
            backend/ml/data/processed/market_features.csv
            backend/ml/data/processed/analyzed_news.csv
            backend/ml/data/processed/gold_training_dataset.csv
            backend/ml/data/processed/evaluation_report.json

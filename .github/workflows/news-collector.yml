name: News Data Collector

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pydantic

      - name: Collect news data
        env:
          NEWS_LOOKBACK_HOURS: '6'
        run: |
          PYTHONPATH=backend python scripts/collect_news_csv.py

      - name: Commit collected news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news/news_articles.csv

          if git diff --cached --quiet; then
            echo "No new news data to commit."
          else
            git commit -m "data: collect news articles"
            git push
          fi

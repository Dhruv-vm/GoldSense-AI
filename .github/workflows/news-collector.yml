name: News Data Collector

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: news-collector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 30
          pip install --retries 5 --timeout 30 requests beautifulsoup4 pydantic lxml sqlalchemy psycopg[binary] alembic

      - name: Verify Neon schema revision using restricted runtime credentials
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: 'true'
          DB_USE_NULLPOOL: 'true'
        run: |
          test -n "${DATABASE_URL}" || (echo "ERROR: NEON_RUNTIME_DATABASE_URL secret must be set (distinct from migration credentials)." && exit 1)
          PYTHONPATH=backend python scripts/verify_schema_revision.py

      - name: Collect news data and persist durably to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: 'true'
          DB_USE_NULLPOOL: 'true'
          ENABLE_CSV_MIRROR: 'false'
          NEWS_LOOKBACK_HOURS: '24'
          NEWS_LIVE_RETENTION_HOURS: '72'
        run: |
          PYTHONPATH=backend python scripts/collect_news_csv.py

name: Market Data Collector

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Collect market data
        run: python scripts/collect_market_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market/market_rates.csv

          if git diff --cached --quiet; then
            echo "[MARKET WORKFLOW] No new market data to commit."
          else
            git commit -m "data: collect market rates"

            MAX_RETRIES=4
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "[MARKET WORKFLOW] Push attempt $attempt of $MAX_RETRIES..."
              if git pull --rebase origin develop && git push origin develop; then
                echo "[MARKET WORKFLOW] Successfully pushed market updates."
                exit 0
              fi
              echo "[MARKET WORKFLOW] Push failed or encountered concurrent update. Retrying in 5 seconds..."
              sleep 5
            done
            echo "[MARKET WORKFLOW] ERROR: Failed to push after $MAX_RETRIES attempts."
            exit 1
          fi

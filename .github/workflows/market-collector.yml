name: Market Data Collector (Decommissioned - KJPL Exclusive)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decommissioned-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm KJPL-exclusive data policy
        run: |
          echo "Yahoo Finance (yfinance) collector is permanently decommissioned per KJPL-only policy."
          echo "International Spot Gold ($), Spot Silver ($), and USD/INR are ingested exclusively from KJPL."

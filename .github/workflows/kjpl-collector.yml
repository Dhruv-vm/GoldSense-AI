name: KJPL Rate Collector

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # Pipeline A: Scheduled MJDTA Reference Price Collector (~twice daily IST windows)
    - cron: '38 0 * * *'   # Morning early backup
    - cron: '8 1 * * *'    # Morning primary
    - cron: '38 1 * * *'   # Morning late backup

    - cron: '38 7 * * *'   # Evening early backup
    - cron: '8 8 * * *'    # Evening primary
    - cron: '38 8 * * *'   # Evening late backup

  workflow_dispatch:

concurrency:
  group: kjpl-collector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 30
          pip install --retries 5 --timeout 30 requests beautifulsoup4 lxml sqlalchemy pydantic psycopg[binary] alembic numpy pandas scipy

      - name: Verify Neon schema revision using restricted runtime credentials
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: "true"
          DB_USE_NULLPOOL: "true"
        run: |
          test -n "${DATABASE_URL}" || (echo "ERROR: NEON_RUNTIME_DATABASE_URL secret must be set (distinct from migration credentials)." && exit 1)
          PYTHONPATH=backend python scripts/verify_schema_revision.py

      - name: Pipeline A — Collect MJDTA & LBMA Reference Rates directly to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: "true"
          DB_USE_NULLPOOL: "true"
          ENABLE_CSV_MIRROR: "false"
        run: |
          PYTHONPATH=backend python scripts/collect_kjpl_csv.py --mjdta-only

      - name: Run Prospective Shadow Forecast on Latest MJDTA Origin
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: "true"
          DB_USE_NULLPOOL: "true"
        run: |
          PYTHONPATH=backend python scripts/run_prospective_forecast.py

      - name: Interim 5-City One-Time Snapshot (until Oracle continuous worker is active)
        if: vars.ORACLE_WORKER_ACTIVE != 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_RUNTIME_DATABASE_URL }}
          REQUIRE_POSTGRES: "true"
          DB_USE_NULLPOOL: "true"
          ENABLE_CSV_MIRROR: "false"
        run: |
          PYTHONPATH=backend python scripts/collect_kjpl_csv.py --snapshot-only

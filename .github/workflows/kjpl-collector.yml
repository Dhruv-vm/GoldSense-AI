name: KJPL Rate Collector

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # Morning collection window (Primary: 11:00 AM IST)
    - cron: '0 5 * * *'    # 10:30 AM IST (Morning early backup)
    - cron: '30 5 * * *'   # 11:00 AM IST (Morning primary)
    - cron: '0 6 * * *'    # 11:30 AM IST (Morning late backup)

    # Evening collection window (Primary: 6:00 PM IST)
    - cron: '0 12 * * *'   # 05:30 PM IST (Evening early backup)
    - cron: '30 12 * * *'  # 06:00 PM IST (Evening primary)
    - cron: '0 13 * * *'   # 06:30 PM IST (Evening late backup)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect KJPL rate
        run: python scripts/collect_kjpl_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kjpl/kjpl_rates.csv

          if git diff --cached --quiet; then
            echo "[KJPL WORKFLOW] No new KJPL data to commit."
          else
            git commit -m "data: collect KJPL rate"
            git pull --rebase origin develop
            git push origin develop
          fi

name: KJPL Rate Collector

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # Off-peak minutes (:23, :51, :53) avoid GitHub's platform-wide :00 and :30 queue traffic jams.
    # Morning collection window (~10:23 AM - 11:21 AM IST)
    - cron: '53 4 * * *'   # 10:23 AM IST (Morning early backup)
    - cron: '23 5 * * *'   # 10:53 AM IST (Morning primary)
    - cron: '51 5 * * *'   # 11:21 AM IST (Morning late backup)

    # Evening collection window (~05:23 PM - 06:23 PM IST)
    - cron: '53 11 * * *'  # 05:23 PM IST (Evening early backup)
    - cron: '23 12 * * *'  # 05:53 PM IST (Evening primary)
    - cron: '53 12 * * *'  # 06:23 PM IST (Evening late backup)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect KJPL rate
        run: python scripts/collect_kjpl_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kjpl/kjpl_rates.csv

          if git diff --cached --quiet; then
            echo "[KJPL WORKFLOW] No new KJPL data to commit."
          else
            git commit -m "data: collect KJPL rate"
            git pull --rebase origin develop
            git push origin develop
          fi

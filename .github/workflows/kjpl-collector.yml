name: KJPL Rate Collector

on:
  schedule:
    # Morning window: 9:30 AM - 11:00 AM IST
    # IST = UTC + 5:30
    - cron: '30,45 3 * * *'
    - cron: '0,15,30,45 4 * * *'
    - cron: '0 5 * * *'

    # Evening window: 5:30 PM - 7:00 PM IST
    - cron: '30,45 11 * * *'
    - cron: '0,15,30,45 12 * * *'
    - cron: '0 13 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect KJPL rate
        run: python scripts/collect_kjpl_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kjpl/kjpl_rates.csv

          if git diff --cached --quiet; then
            echo "No new KJPL data to commit."
          else
            git commit -m "data: collect KJPL rate"
            git push
          fi

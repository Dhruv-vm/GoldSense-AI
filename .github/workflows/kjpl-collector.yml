name: KJPL Rate Collector

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # Morning window: 11:00 AM IST (05:30 UTC) & follow-up at 11:30 AM IST (06:00 UTC)
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'

    # Evening window: 6:30 PM IST (13:00 UTC) & follow-up at 7:00 PM IST (13:30 UTC)
    - cron: '0 13 * * *'
    - cron: '30 13 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect KJPL rate
        run: python scripts/collect_kjpl_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kjpl/kjpl_rates.csv

          if git diff --cached --quiet; then
            echo "No new KJPL data to commit."
          else
            git commit -m "data: collect KJPL rate"
            git pull --rebase origin develop
            git push origin develop
          fi

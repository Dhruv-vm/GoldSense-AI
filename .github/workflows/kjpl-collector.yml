name: KJPL Rate Collector

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # Target publication windows:
    #   Morning Window : ~10:15 AM - 11:30 AM IST (KJPL morning rate published ~09:30-10:00 AM)
    #   Evening Window : ~05:15 PM - 06:30 PM IST (KJPL evening rate published ~04:30-05:30 PM)

    # Morning target window (~10:15 AM - 11:30 AM IST) - pre-shifted for runner backlog:
    - cron: '38 0 * * *'   # Morning early backup
    - cron: '8 1 * * *'    # Morning primary
    - cron: '38 1 * * *'   # Morning late backup

    # Evening target window (~05:15 PM - 06:40 PM IST) - pre-shifted:
    - cron: '38 7 * * *'   # Evening early backup
    - cron: '8 8 * * *'    # Evening primary
    - cron: '38 8 * * *'   # Evening late backup

  workflow_dispatch:

concurrency:
  group: kjpl-collector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-kjpl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 sqlalchemy pydantic psycopg[binary]

      - name: Collect KJPL city-wise & benchmark bullion rates
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: ${{ secrets.SUPABASE_DATABASE_URL && 'production' || 'development' }}
        run: |
          PYTHONPATH=backend python scripts/collect_kjpl_csv.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kjpl/kjpl_rates.csv data/kjpl/city_rates.csv

          if git diff --cached --quiet; then
            echo "[KJPL WORKFLOW] Rates unchanged. No new observation rows to commit."
          else
            git commit -m "data: collect city-wise KJPL bullion rates"

            MAX_RETRIES=4
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "[KJPL WORKFLOW] Push attempt $attempt of $MAX_RETRIES..."
              if git pull --rebase origin develop && git push origin develop; then
                echo "[KJPL WORKFLOW] Successfully pushed bullion updates."
                exit 0
              fi
              echo "[KJPL WORKFLOW] Push failed or encountered concurrent update. Retrying in 5 seconds..."
              sleep 5
            done
            echo "[KJPL WORKFLOW] ERROR: Failed to push after $MAX_RETRIES attempts."
            exit 1
          fi
